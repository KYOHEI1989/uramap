<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UraMap - 裏垢・パパ活・ママ活 地域検索ポータル</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Orbitron:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',sans-serif;background:#0a0a12;color:#e0e0e0;min-height:100vh}

header{text-align:center;padding:28px 20px 8px}
.logo{font-family:'Orbitron',sans-serif;font-size:36px;font-weight:900;background:linear-gradient(135deg,#a78bfa,#ec4899,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px}
.logo-sub{font-size:11px;color:rgba(255,255,255,.3);margin-top:4px;letter-spacing:2px}

.category-tabs{display:flex;justify-content:center;gap:8px;padding:16px 20px;flex-wrap:wrap}
.cat-tab{padding:10px 28px;border-radius:100px;border:2px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);font-size:14px;font-weight:700;cursor:pointer;transition:all .3s}
.cat-tab:hover{border-color:rgba(255,255,255,.15);color:#fff}
.cat-tab.active[data-cat="ura"]{border-color:#a78bfa;color:#fff;background:rgba(167,139,250,.12);box-shadow:0 0 20px rgba(167,139,250,.2)}
.cat-tab.active[data-cat="papa"]{border-color:#f97316;color:#fff;background:rgba(249,115,22,.12);box-shadow:0 0 20px rgba(249,115,22,.2)}
.cat-tab.active[data-cat="mama"]{border-color:#ec4899;color:#fff;background:rgba(236,72,153,.12);box-shadow:0 0 20px rgba(236,72,153,.2)}
.cat-tab .emoji{margin-right:6px}

/* ── バナー広告（クリック型） ── */
.ad-banner{max-width:820px;margin:0 auto 20px;padding:0 16px}
.ad-banner a{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:80px;border-radius:12px;
  background:linear-gradient(135deg,rgba(167,139,250,.1),rgba(236,72,153,.1));
  border:1px solid rgba(167,139,250,.2);
  color:rgba(255,255,255,.5);font-size:12px;letter-spacing:1px;
  text-decoration:none;transition:all .3s;position:relative;overflow:hidden;
  gap:10px;
}
.ad-banner a:hover{background:linear-gradient(135deg,rgba(167,139,250,.18),rgba(236,72,153,.18));border-color:rgba(167,139,250,.4);color:#fff}
.ad-banner a::before{content:'AD';position:absolute;top:6px;left:8px;font-size:9px;color:rgba(255,255,255,.2);letter-spacing:1px}
.ad-banner.mid a{
  background:linear-gradient(135deg,rgba(249,115,22,.08),rgba(251,191,36,.08));
  border-color:rgba(249,115,22,.2);
}
.ad-banner.mid a:hover{background:linear-gradient(135deg,rgba(249,115,22,.16),rgba(251,191,36,.16));border-color:rgba(249,115,22,.4)}

.main-list{max-width:820px;margin:0 auto;padding:0 16px 24px}

.region-section{margin-bottom:20px}
.region-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06)}
.region-name{font-size:16px;font-weight:900;color:rgba(255,255,255,.7)}
.region-bar{flex:1;height:1px;background:rgba(255,255,255,.04)}
.region-count{font-size:11px;color:rgba(255,255,255,.2)}

.pref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.pref-btn{padding:14px 8px;border-radius:10px;text-align:center;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);color:rgba(255,255,255,.55);position:relative}
.pref-btn:hover{color:#fff;transform:translateY(-2px)}
.pref-btn.hot::after{content:'HOT';position:absolute;top:-6px;right:-2px;font-size:7px;font-weight:900;color:#fff;background:#ef4444;border-radius:4px;padding:1px 4px;letter-spacing:.5px}
.pref-btn.hot{z-index:1}

/* ── 表示切替（地図/リスト） ── */
.view-toggle{display:flex;justify-content:center;gap:6px;max-width:820px;margin:0 auto 6px;padding:0 16px}
.view-btn{padding:7px 20px;border-radius:100px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:rgba(255,255,255,.4);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.view-btn:hover{color:#fff}
.view-btn.active{border-color:rgba(255,255,255,.25);color:#fff;background:rgba(255,255,255,.08)}

/* ── 地図（2段階：全国の地方ブロック → 地方内の県タイル） ── */
/* カテゴリごとのネオン発光色 */
[data-theme="ura"]{--glow:167,139,250;--glow2:236,72,153}
[data-theme="papa"]{--glow:249,115,22;--glow2:251,191,36}
[data-theme="mama"]{--glow:236,72,153;--glow2:244,114,182}

.map-area{max-width:820px;margin:0 auto;padding:10px 16px 28px}

/* 全国ビュー：地方ブロック */
.region-map{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:78px;gap:10px}
.region-block{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border-radius:16px;cursor:pointer;transition:all .25s;position:relative;padding:4px;text-align:center;
  background:linear-gradient(145deg,rgba(var(--glow),.18),rgba(var(--glow2),.10));
  border:1px solid rgba(var(--glow),.55);
  box-shadow:0 0 18px rgba(var(--glow),.22),inset 0 0 24px rgba(var(--glow),.07);
}
.region-block:hover{transform:translateY(-3px) scale(1.02);border-color:rgba(var(--glow),.95);box-shadow:0 0 32px rgba(var(--glow),.5),inset 0 0 30px rgba(var(--glow),.14)}
.rb-name{font-size:clamp(11px,1.9vw,16px);font-weight:900;color:#fff;text-shadow:0 0 10px rgba(var(--glow),.9);word-break:keep-all;line-height:1.3}
.rb-count{font-size:9px;color:rgba(255,255,255,.55);letter-spacing:1px}

/* 地方ビュー：県タイル */
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back-btn{padding:8px 18px;border-radius:100px;border:1px solid rgba(var(--glow),.5);background:rgba(var(--glow),.1);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.back-btn:hover{background:rgba(var(--glow),.25);box-shadow:0 0 14px rgba(var(--glow),.4)}
.detail-title{font-size:18px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(var(--glow),.85)}
.pref-map{display:grid;gap:10px;justify-content:center}
.map-cell{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:14px;font-size:clamp(12px,2.2vw,16px);font-weight:900;cursor:pointer;transition:all .25s;position:relative;
  background:linear-gradient(145deg,rgba(var(--glow),.24),rgba(var(--glow2),.13));
  border:1px solid rgba(var(--glow),.65);color:#fff;text-shadow:0 0 8px rgba(var(--glow),.9);
  box-shadow:0 0 16px rgba(var(--glow),.28),inset 0 0 20px rgba(var(--glow),.09);
}
.map-cell:hover{transform:translateY(-3px) scale(1.06);border-color:rgba(var(--glow),1);box-shadow:0 0 30px rgba(var(--glow),.65),inset 0 0 26px rgba(var(--glow),.16)}
.map-cell.hot{animation:hotPulse 2.2s ease-in-out infinite}
@keyframes hotPulse{
  0%,100%{box-shadow:0 0 16px rgba(var(--glow),.28),inset 0 0 20px rgba(var(--glow),.09)}
  50%{box-shadow:0 0 32px rgba(var(--glow),.65),inset 0 0 26px rgba(var(--glow),.16)}
}
.map-cell.hot::after{content:'HOT';position:absolute;top:-7px;right:-4px;font-size:8px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ef4444,#ec4899);border-radius:5px;padding:2px 5px;letter-spacing:.5px;box-shadow:0 0 8px rgba(239,68,68,.8)}
@media (max-width:480px){
  .region-map{gap:6px;grid-auto-rows:66px}
  .pref-map{gap:7px}
}

[data-theme="ura"] .pref-btn:hover{background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.4);box-shadow:0 0 12px rgba(167,139,250,.15)}
[data-theme="ura"] .region-name{color:#c4b5fd}
[data-theme="papa"] .pref-btn:hover{background:rgba(249,115,22,.15);border-color:rgba(249,115,22,.4);box-shadow:0 0 12px rgba(249,115,22,.15)}
[data-theme="papa"] .region-name{color:#fdba74}
[data-theme="mama"] .pref-btn:hover{background:rgba(236,72,153,.15);border-color:rgba(236,72,153,.4);box-shadow:0 0 12px rgba(236,72,153,.15)}
[data-theme="mama"] .region-name{color:#f9a8d4}

/* ── モーダル ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:1000;justify-content:center;align-items:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:#14141f;border:1px solid rgba(255,255,255,.08);border-radius:20px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:32px;position:relative;animation:modalIn .3s ease-out}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:rgba(255,255,255,.1)}
.modal-pref{font-size:28px;font-weight:900;margin-bottom:4px}
.modal-region{font-size:12px;color:rgba(255,255,255,.35);margin-bottom:24px}

.search-buttons{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.search-btn{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;text-decoration:none;width:100%;font-family:inherit;text-align:left}
.search-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);transform:translateX(4px)}
.search-btn .tag{font-size:12px;color:rgba(255,255,255,.4);margin-left:auto}
.search-btn .arrow{margin-left:8px;opacity:.3}

/* ── 成果型アフィリ（モーダル内） ── */
.modal-divider{border:none;height:1px;background:rgba(255,255,255,.06);margin:20px 0}
.cpa-section-title{font-size:11px;color:rgba(255,255,255,.25);letter-spacing:2px;margin-bottom:10px}
.cpa-links{display:flex;flex-direction:column;gap:8px}
.cpa-btn{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;border-radius:12px;
  text-decoration:none;transition:all .2s;
  border:1px solid;font-weight:700;font-size:14px;
}
.cpa-btn:hover{transform:translateX(4px)}
.cpa-btn.type-dating{
  background:rgba(236,72,153,.1);border-color:rgba(236,72,153,.3);color:#f9a8d4;
}
.cpa-btn.type-dating:hover{background:rgba(236,72,153,.2);border-color:#ec4899}
.cpa-btn.type-adult{
  background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.3);color:#fdba74;
}
.cpa-btn.type-adult:hover{background:rgba(249,115,22,.2);border-color:#f97316}
.cpa-btn .cpa-icon{font-size:20px;flex-shrink:0}
.cpa-btn .cpa-text{flex:1}
.cpa-btn .cpa-label{font-size:10px;opacity:.5;font-weight:400;display:block;margin-top:1px}
.cpa-btn .cpa-badge{font-size:10px;padding:3px 8px;border-radius:100px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)}

.trending{max-width:820px;margin:0 auto;padding:0 16px 40px}
.trending-title{font-size:14px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:12px}
.trending-tags{display:flex;flex-wrap:wrap;gap:8px}
.trend-tag{padding:8px 16px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);font-size:13px;color:rgba(255,255,255,.5);cursor:pointer;transition:all .2s;text-decoration:none}
.trend-tag:hover{background:rgba(255,255,255,.08);color:#fff}

footer{text-align:center;padding:24px;font-size:11px;color:rgba(255,255,255,.15);border-top:1px solid rgba(255,255,255,.04)}

.age-gate{position:fixed;inset:0;background:#0a0a12;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.age-gate.hidden{display:none}
.age-gate h2{font-size:24px;color:#fff}
.age-gate p{font-size:14px;color:rgba(255,255,255,.5);text-align:center;line-height:1.7}
.age-gate .btn-row{display:flex;gap:16px}
.age-btn{padding:14px 40px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;border:none;transition:all .2s}
.age-btn.yes{background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff}
.age-btn.yes:hover{transform:scale(1.05)}
.age-btn.no{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5)}
</style>
</head>

<div id="mainContent" style="display:none" data-theme="ura">

<footer>&copy; 2026 UraMap - 当サイトはX上の公開情報への検索リンクを提供しています。本ページには広告が含まれます。</footer>
</div>

<!-- ── モーダル ── -->
<div class="modal-overlay" id="modal">

  '愛知':'aichi','静岡':'shizuoka','岐阜':'gifu','三重':'mie',
  '大阪':'osaka','京都':'kyoto','兵庫':'hyogo','奈良':'nara','滋賀':'shiga','和歌山':'wakayama',
  '広島':'hiroshima','岡山':'okayama','山口':'yamaguchi','鳥取':'tottori','島根':'shimane','香川':'kagawa','愛媛':'ehime','高知':'kochi','徳島':'tokushima',
  '福岡':'fukuoka','熊本':'kumamoto','鹿児島':'kagoshima','長崎':'nagasaki','大分':'oita','佐賀':'saga','宮崎':'miyazaki','沖縄':'okinawa'
};
const slugToPref = Object.fromEntries(Object.entries(prefSlugs).map(([k, v]) => [v, k]));
const prefRegion = {};
regions.forEach(r => r.prefs.forEach(p => { prefRegion[p.name] = r.name; }));

function enterSite() {
  localStorage.setItem('uramap-age-ok', '1');
  showSite();
}

// ── タイル型日本地図：都道府県のグリッド座標 [列, 行]（実際の位置関係に対応） ──
const mapPos = {
  '北海道':[13,1],'青森':[13,2],'秋田':[12,3],'岩手':[13,3],'山形':[12,4],'宮城':[13,4],'新潟':[11,5],'福島':[12,5],
  '石川':[9,5],'富山':[10,5],
  '福井':[8,6],'岐阜':[9,6],'長野':[10,6],'群馬':[11,6],'栃木':[12,6],'茨城':[13,6],
  '島根':[4,6],'鳥取':[5,6],'兵庫':[6,6],'京都':[7,6],
  '佐賀':[1,7],'福岡':[2,7],'山口':[3,7],'広島':[4,7],'岡山':[5,7],'大阪':[6,7],'奈良':[7,7],'滋賀':[8,7],'愛知':[9,7],'静岡':[10,7],'山梨':[11,7],'埼玉':[12,7],'千葉':[13,7],
  '長崎':[1,8],'熊本':[2,8],'大分':[3,8],'愛媛':[4,8],'香川':[5,8],'和歌山':[6,8],'三重':[8,8],'神奈川':[11,8],'東京':[12,8],
  '鹿児島':[2,9],'宮崎':[3,9],'高知':[5,9],'徳島':[6,9],
  '沖縄':[1,10]
};
// 地方のURLスラッグと、全国ビューでのブロック配置 [列開始, 列終了, 行開始, 行終了]
const regionSlugs = ['hokkaido','tohoku','kanto','hokuriku','tokai','kansai','chugoku','shikoku','kyushu'];
const regionArea = [
  [10,12,1,1], // 北海道
  [10,12,2,2], // 東北
  [10,12,3,3], // 関東
  [7,9,2,2],   // 北陸・甲信越
  [7,9,3,3],   // 東海
  [5,6,3,3],   // 関西
  [3,4,3,3],   // 中国
  [3,4,4,4],   // 四国
  [1,2,3,4]    // 九州・沖縄
];

let currentView = localStorage.getItem('uramap-view') || 'map';
let currentRegion = null; // null = 全国ビュー

function switchView(view) {
  currentView = view;
  localStorage.setItem('uramap-view', view);
  applyView();
}

function applyView() {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  document.getElementById('mapView').style.display = currentView === 'map' ? '' : 'none';
  document.getElementById('prefList').style.display = currentView === 'list' ? '' : 'none';
}

// 1県だけの地方（北海道）は中間ページを挟まず直接モーダルへ
function openRegion(i) {
  location.hash = regions[i].prefs.length === 1
    ? `${currentCat}/${prefSlugs[regions[i].prefs[0].name]}`
    : `${currentCat}/${regionSlugs[i]}`;
}
function backToJapan() { location.hash = currentCat; }

function setRegion(i) {
  currentRegion = i;
  renderMapArea();
}

function renderMapArea() {
  const area = document.getElementById('mapArea');
  if (currentRegion === null) {
    // 全国ビュー：地方ブロック
    area.innerHTML = '<div class="region-map">' + regions.map((r, i) => {
      const [c1, c2, r1, r2] = regionArea[i];
      const hot = r.prefs.filter(p => p.hot).length;
      return `<div class="region-block" style="grid-column:${c1}/${c2 + 1};grid-row:${r1}/${r2 + 1}" onclick="openRegion(${i})">
        <span class="rb-name">${r.name.replace('・', '・<wbr>')}</span>
        <span class="rb-count">${r.prefs.length}県${hot ? ' &#x1F525;' + hot : ''}</span>
      </div>`;
    }).join('') + '</div>';
  } else {
    // 地方ビュー：県タイル（全国地図の位置関係を保ったまま切り出し）
    const r = regions[currentRegion];
    const cols = r.prefs.map(p => mapPos[p.name][0]);
    const rows = r.prefs.map(p => mapPos[p.name][1]);
    const minC = Math.min(...cols), maxC = Math.max(...cols), minR = Math.min(...rows);
    area.innerHTML = `
      <div class="detail-head">
        <button class="back-btn" onclick="backToJapan()">&#x2190; 全国</button>
        <span class="detail-title">${r.name}</span>
      </div>
      <div class="pref-map" style="grid-template-columns:repeat(${maxC - minC + 1},minmax(64px,108px))">` +
      r.prefs.map(p => {
        const [c, rw] = mapPos[p.name];
        return `<div class="map-cell${p.hot ? ' hot' : ''}" style="grid-column:${c - minC + 1};grid-row:${rw - minR + 1}" onclick="openModal('${p.name}')">${p.name}</div>`;
      }).join('') + '</div>';
  }
}

function showSite() {
  document.getElementById('ageGate').classList.add('hidden');
  document.getElementById('mainContent').style.display = 'block';
  renderList(); applyView(); applyHash();
}

// URLハッシュを読んで画面状態を復元する（戻る/進むボタンにも対応）
// #カテゴリ → 全国 / #カテゴリ/地方 → 県タイル / #カテゴリ/県 → モーダル
function applyHash() {
  const parts = decodeURIComponent(location.hash.slice(1)).split('/');
  const cat = catConfig[parts[0]] ? parts[0] : 'ura';
  setCat(cat);
  const key = parts[1] || '';
  const label = catConfig[cat].label;
  const pref = slugToPref[key];
  const regionIdx = regionSlugs.indexOf(key);
  if (pref) {
    setRegion(regions.findIndex(r => r.name === prefRegion[pref]));
    showModal(pref);
    document.title = `${pref}の${label} | UraMap`;
  } else if (regionIdx >= 0) {
    setRegion(regionIdx);
    hideModal();
    document.title = `${regions[regionIdx].name}の${label} | UraMap`;
  } else {
    setRegion(null);
    hideModal();
    document.title = `UraMap - ${label} 地域検索ポータル`;
  }
}

function renderList() {
  document.getElementById('prefList').innerHTML = regions.map(r => `
    <div class="region-section">
      <div class="region-header">
        <div class="region-name">${r.name}</div>
        <div class="region-bar"></div>
        <div class="region-count">${r.prefs.length}件</div>
      </div>
      <div class="pref-grid">
        ${r.prefs.map(p => `<div class="pref-btn${p.hot?' hot':''}" onclick="openModal('${p.name}')">${p.name}</div>`).join('')}
      </div>
    </div>
  `).join('');
}

// タブ・地方・都道府県クリックはURLハッシュを変えるだけ。実際の描画はapplyHashが行う
function switchCat(cat) {
  setCat(cat);
  location.hash = currentRegion === null ? cat : `${cat}/${regionSlugs[currentRegion]}`;
}
function openModal(pref) { location.hash = `${currentCat}/${prefSlugs[pref]}`; }
function closeModal() {
  // 1県だけの地方は地方ビューが無いので全国へ戻す（地方スラッグに飛ばすとモーダルが再度開いてしまう）
  const r = currentRegion === null ? null : regions[currentRegion];
  location.hash = r && r.prefs.length > 1 ? `${currentCat}/${regionSlugs[currentRegion]}` : currentCat;
}

function setCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
  document.getElementById('mainContent').setAttribute('data-theme', cat);
  updateTrending();
}

function updateTrending() {
  document.getElementById('trendingTags').innerHTML = catConfig[currentCat].trending.map(tag =>
    `<a class="trend-tag" href="https://x.com/search?q=${encodeURIComponent(tag)}&f=live" target="_blank" rel="noopener">${tag}</a>`
  ).join('');
}

function showModal(pref) {
  const cfg = catConfig[currentCat];
  document.getElementById('modalPref').textContent = pref;
  document.getElementById('modalPref').style.color = cfg.color;
  document.getElementById('modalRegion').textContent = prefRegion[pref];

  // X検索リンク（クリックでXアプリ起動＋現在タブをアフィリへ）
  document.getElementById('searchButtons').innerHTML = cfg.tags.map((tag, i) => {
    const xUrl = `https://x.com/search?q=${encodeURIComponent('#'+tag+' #'+pref)}&f=live`;
    // アフィリURLをタグごとにローテーション（クリック型バナーと同じURLでOK）
    const aff = cpaConfig[i % cpaConfig.length].href + `?from=x&pref=${encodeURIComponent(pref)}`;
    return `<button class="search-btn" onclick="openXAndAffiliate('${xUrl}','${aff}')">
      <span>&#x1F426;</span><span>#${tag} #${pref}</span>
      <span class="tag">Xで検索</span><span class="arrow">&#x2192;</span></button>`;
  }).join('');

  // 成果型アフィリ（都道府県名をパラメータに付与できる）
  document.getElementById('cpaLinks').innerHTML = cpaConfig.map(c =>
    `<a class="cpa-btn ${c.type}" href="${c.href}?pref=${encodeURIComponent(pref)}" target="_blank" rel="noopener sponsored">
      <span class="cpa-icon">${c.icon}</span>
      <span class="cpa-text">
        <strong>${c.label}</strong>（${pref}）
        <span class="cpa-label">${c.sub}</span>
      </span>
      <span class="cpa-badge">${c.badge}</span>
    </a>`
  ).join('');

  document.getElementById('modal').classList.add('open');
}

// Xアプリを開きつつ現在タブをアフィリへ飛ばす
function openXAndAffiliate(xUrl, affiliateUrl) {
  // Xを新タブで開く（モバイルではアプリが起動）
  window.open(xUrl, '_blank', 'noopener');
  // 少し遅らせて現在タブをアフィリへ
  setTimeout(() => {
    window.location.href = affiliateUrl;
  }, 300);
}

function hideModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// 戻る/進むボタン・URL直接入力に対応
window.addEventListener('hashchange', applyHash);

// 年齢確認済みならゲートをスキップして即表示（共有URLから直接開けるように）
if (localStorage.getItem('uramap-age-ok') === '1') showSite();
</script>
</body>
</html>
